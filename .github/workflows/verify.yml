# Check obligatorio de gitops (tarea 10): toda imagen de apps/ va por digest, se construyó
# desde main de la aplicación y está firmada por el pipeline de core.
name: verify

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

jobs:
  verify:
    permissions:
      contents: read
    uses: acbacb77/poc-almagentic-core/.github/workflows/reusable-verify-images.yml@v1

  scripts:
    # Tests del puente de alertas y del exportador de telemetría (solo biblioteca estándar).
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Tests de cluster/observabilidad
        working-directory: cluster/observabilidad
        run: python3 -m unittest -v
