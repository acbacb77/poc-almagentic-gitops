# LoadBalancer: Docker Desktop publica el puerto 8000 en el equipo (localhost:8000 en Windows;
# host.docker.internal:8000 desde contenedores). En un clúster real iría detrás de un Ingress.
# Ojo: expone también /metrics. Pendiente (tarea 11): servir las métricas en un puerto aparte
# que este Service no publique.
apiVersion: v1
kind: Service
metadata:
  name: poc-almagentic-app
  labels:
    app.kubernetes.io/name: poc-almagentic-app
spec:
  type: LoadBalancer
  selector:
    app.kubernetes.io/name: poc-almagentic-app
  ports:
    - name: http
      port: 8000
      targetPort: http
