# API del catálogo en staging. El digest lo cambia el promotor con un PR (tarea 10):
# fusionar ese PR es la aprobación del despliegue.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: staging
labels:
  - pairs:
      app.kubernetes.io/part-of: poc-almagentic
    includeSelectors: false
resources:
  - deployment.yaml
  - service.yaml
images:
  - name: ghcr.io/acbacb77/poc-almagentic-app
    digest: sha256:e9504a2effd0727ea795f99d41cf0134991a458b5cfabcd1c52b1d5b804086e8
