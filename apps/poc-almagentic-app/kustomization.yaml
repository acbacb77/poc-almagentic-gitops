kind: Kustomization
namespace: staging
labels:
  - pairs:
      app.kubernetes.io/part-of: poc-almagentic
    includeSelectors: false
resources:
  - deployment.yaml
  - service.yaml
images:
  - name: ghcr.io/acbacb77/poc-almagentic-app
    digest: sha256:8d83a6642a2d04cdfc6b1be4e78d85575bab8ad9f5015af4b39c6c8e89392230
