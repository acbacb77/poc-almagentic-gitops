kind: Kustomization
namespace: staging
labels:
  - pairs:
      app.kubernetes.io/part-of: poc-almagentic
    includeSelectors: false
resources:
  - deployment.yaml
  - service.yaml
images:
  - name: ghcr.io/acbacb77/poc-almagentic-app
    digest: sha256:985aa2755bf5b3dd73339b0b640dfb38a0cc883f8898d7b58b02fd5528a2d04b
