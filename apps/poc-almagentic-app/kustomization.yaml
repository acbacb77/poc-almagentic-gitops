kind: Kustomization
namespace: staging
labels:
  - pairs:
      app.kubernetes.io/part-of: poc-almagentic
    includeSelectors: false
resources:
  - deployment.yaml
  - service.yaml
images:
  - name: ghcr.io/acbacb77/poc-almagentic-app
    digest: sha256:27e2b00a7c64f538d313ddda292bbe673804487632338869a3950e63e055e654
