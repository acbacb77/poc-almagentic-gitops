apiVersion: apps/v1
kind: Deployment
metadata:
  name: poc-almagentic-app
  labels:
    app.kubernetes.io/name: poc-almagentic-app
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: poc-almagentic-app
  template:
    metadata:
      labels:
        app.kubernetes.io/name: poc-almagentic-app
      annotations:
        # Prometheus lee las métricas del puerto propio, que el Service no publica (tarea 11).
        prometheus.io/scrape: "true"
        prometheus.io/port: "9000"
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          # Sin etiqueta: kustomize pone el digest de kustomization.yaml.
          image: ghcr.io/acbacb77/poc-almagentic-app
          env:
            - name: METRICS_PORT
              value: "9000"
          ports:
            - name: http
              containerPort: 8000
            - name: metrics
              containerPort: 9000
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
