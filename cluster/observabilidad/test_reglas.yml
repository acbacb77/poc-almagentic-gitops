# Prueba de las reglas de alerta: extraer serverFiles.alerting_rules.yml de argocd-apps/prometheus.yaml
# a reglas.yml y ejecutar: promtool test rules test_reglas.yml
rule_files: [reglas.yml]
evaluation_interval: 30s
tests:
  - interval: 30s
    input_series:
      - series: 'app_consultas_total{ruta="/api/v1/productos",estado="200"}'
        values: '0+2x30'
      - series: 'app_consultas_total{ruta="/api/v1/productos",estado="422"}'
        values: '0+3x30'
      - series: 'up{app_kubernetes_io_name="poc-almagentic-app"}'
        values: '1x30'
    alert_rule_test:
      - eval_time: 10m
        alertname: BusquedasRechazadas
        exp_alerts:
          - exp_labels: {severity: aviso}
            exp_annotations:
              summary: Muchas búsquedas de productos se rechazan por longitud
              valor: 60% de las búsquedas en 5 minutos
              description: En staging, el 60% de las búsquedas de los últimos 5 minutos (GET /api/v1/productos?q=…) ha recibido 422 porque el texto de q supera los 100 caracteres (FR-009 de la spec 002-buscar-productos-nombre). O hay clientes que necesitan un límite mayor o hay un cliente mal configurado. Por privacidad no se registra el texto buscado (FR-011), solo la longitud en el log de búsqueda.
              para_quien: La tienda web que consume la API
              impacto: Que la tienda pueda buscar con textos más largos, o confirmar que el límite actual es el correcto.
              urgencia: Este mes
      - eval_time: 10m
        alertname: ApiSinRespuesta
        exp_alerts: []
  - interval: 30s
    input_series:
      - series: 'app_consultas_total{ruta="/api/v1/productos",estado="200"}'
        values: '0+10x30'
      - series: 'app_consultas_total{ruta="/api/v1/productos",estado="422"}'
        values: '0+1x30'
      - series: 'up{app_kubernetes_io_name="poc-almagentic-app"}'
        values: '0x30'
    alert_rule_test:
      - eval_time: 10m
        alertname: BusquedasRechazadas
        exp_alerts: []
      - eval_time: 5m
        alertname: ApiSinRespuesta
        exp_alerts:
          - exp_labels: {severity: critica}
            exp_annotations:
              summary: La API del catálogo no responde en staging
              valor: Ningún pod de la API responde a Prometheus
              description: Prometheus no consigue leer las métricas de ningún pod de poc-almagentic-app en staging desde hace más de 2 minutos. Revisar el Deployment en Argo CD y los eventos del namespace.
              urgencia: Está bloqueando a alguien
