# Prueba de las reglas de alerta: extraer serverFiles.alerting_rules.yml de argocd-apps/prometheus.yaml
# a reglas.yml y ejecutar: promtool test rules test_reglas.yml
rule_files: [reglas.yml]
evaluation_interval: 30s
tests:
  - interval: 30s
    input_series:
      - series: 'app_consultas_total{ruta="/api/v1/productos",estado="200"}'
        values: '0+2x30'
      - series: 'app_consultas_total{ruta="/api/v1/productos",estado="422"}'
        values: '0+3x30'
      - series: 'up{app_kubernetes_io_name="poc-almagentic-app"}'
        values: '1x30'
    alert_rule_test:
      - eval_time: 10m
        alertname: BusquedasRechazadas
        exp_alerts:
          - exp_labels: {severity: aviso}
            exp_annotations:
              summary: Muchas búsquedas de productos se rechazan por longitud
              valor: 60% de las búsquedas en 5 minutos
              description: En staging, el 60% de las búsquedas de los últimos 5 minutos (GET /api/v1/productos?q=…) ha recibido 422 porque el texto de q supera los 200 caracteres (FR-009 de la spec 002-buscar-productos-nombre, ampliado por la spec 003). O hay clientes que necesitan un límite mayor o hay un cliente mal configurado. Por privacidad no se registra el texto buscado (FR-011), solo la longitud en el log de búsqueda.
              para_quien: La tienda web que consume la API
              impacto: Que la tienda pueda buscar con textos más largos, o confirmar que el límite actual es el correcto.
              urgencia: Este mes
      - eval_time: 10m
        alertname: ApiSinRespuesta
        exp_alerts: []
  - interval: 30s
    input_series:
      - series: 'app_consultas_total{ruta="/api/v1/productos",estado="200"}'
        values: '0+10x30'
      - series: 'app_consultas_total{ruta="/api/v1/productos",estado="422"}'
        values: '0+1x30'
      - series: 'up{app_kubernetes_io_name="poc-almagentic-app"}'
        values: '0x30'
    alert_rule_test:
      - eval_time: 10m
        alertname: BusquedasRechazadas
        exp_alerts: []
      - eval_time: 5m
        alertname: ApiSinRespuesta
        exp_alerts:
          - exp_labels: {severity: critica}
            exp_annotations:
              summary: La API del catálogo no responde en staging
              valor: Ningún pod de la API responde a Prometheus
              description: Prometheus no consigue leer las métricas de ningún pod de poc-almagentic-app en staging desde hace más de 2 minutos. Revisar el Deployment en Argo CD y los eventos del namespace.
              urgencia: Está bloqueando a alguien
  # Alertas del proceso (tarea E): llevan ambito=proceso y no pasan por el puente.
  - interval: 1m
    input_series:
      - series: 'alm_workflow_fallido_timestamp{repo="app",workflow="evals",paso="no llegó a arrancar",url="u"}'
        values: '1792950000x20'
      - series: 'alm_promociones_sustituidas'
        values: '2x40'
      - series: 'alm_colector_ok'
        values: '1x40'
      - series: 'alm_argocd_app{app="staging",sync="Synced",health="Healthy"}'
        values: '1x40'
    alert_rule_test:
      - eval_time: 15m
        alertname: WorkflowEnRojoEnMain
        exp_alerts:
          - exp_labels: {severity: aviso, ambito: proceso, repo: app, workflow: evals}
            exp_annotations:
              summary: El último run de evals en main de app ha fallado
      - eval_time: 35m
        alertname: PromocionSustituida
        exp_alerts:
          - exp_labels: {severity: info, ambito: proceso}
            exp_annotations:
              summary: Hay 2 promociones abiertas a las que ya sustituye una más nueva
      - eval_time: 35m
        alertname: ColectorSinDatos
        exp_alerts: []
      - eval_time: 35m
        alertname: ArgoCDDesincronizado
        exp_alerts: []
  - interval: 1m
    input_series:
      - series: 'alm_argocd_app{app="staging",sync="OutOfSync",health="Healthy"}'
        values: '1x30'
    alert_rule_test:
      - eval_time: 20m
        alertname: ColectorSinDatos
        exp_alerts:
          - exp_labels: {severity: aviso, ambito: proceso}
            exp_annotations:
              summary: El colector del estado del proceso no consigue leer GitHub o Argo CD
      - eval_time: 20m
        alertname: ArgoCDDesincronizado
        exp_alerts:
          - exp_labels: {severity: aviso, ambito: proceso, app: staging, sync: OutOfSync, health: Healthy}
            exp_annotations:
              summary: La aplicación staging de Argo CD está OutOfSync / Healthy
