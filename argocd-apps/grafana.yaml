# Grafana (tarea 11) en localhost:3000. La contraseña de admin está en el Secret grafana-admin,
# creado a mano con kubectl (nunca en git), para que Argo CD no la regenere en cada sincronización.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: grafana
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://grafana-community.github.io/helm-charts
    chart: grafana
    targetRevision: 14.0.0
    helm:
      releaseName: grafana
      valuesObject:
        admin:
          existingSecret: grafana-admin
        testFramework:
          enabled: false
        service:
          type: LoadBalancer
          port: 3000
        # Grafana 13 guarda todo en SQLite (emptyDir). Con bloqueos de escritura /api/health
        # devolvía 503 y el liveness reiniciaba el pod a los ~19 min (exit 137, sin OOM).
        # WAL deja leer mientras otro escribe; el CPU pedido evita que el chequeo se quede
        # sin turno en el nodo de Docker Desktop.
        grafana.ini:
          database:
            wal: true
            busy_timeout: 5000
        livenessProbe:
          httpGet:
            path: /api/health
            port: 3000
          initialDelaySeconds: 60
          periodSeconds: 20
          timeoutSeconds: 10
          failureThreshold: 6
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            memory: 512Mi
        datasources:
          datasources.yaml:
            apiVersion: 1
            datasources:
              - name: Prometheus
                uid: prometheus
                type: prometheus
                url: http://prometheus-server.observabilidad.svc:9090
                access: proxy
                isDefault: true
        dashboardProviders:
          dashboardproviders.yaml:
            apiVersion: 1
            providers:
              - name: poc-almagentic
                folder: POC ALM agéntico
                type: file
                disableDeletion: true
                editable: false
                options:
                  path: /var/lib/grafana/dashboards/poc
        dashboardsConfigMaps:
          poc: grafana-paneles
  destination:
    server: https://kubernetes.default.svc
    namespace: observabilidad
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
