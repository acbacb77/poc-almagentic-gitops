# Grafana (tarea 11) en localhost:3000. La contraseña de admin está en el Secret grafana-admin,
# creado a mano con kubectl (nunca en git), para que Argo CD no la regenere en cada sincronización.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: grafana
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://grafana-community.github.io/helm-charts
    chart: grafana
    targetRevision: 14.0.0
    helm:
      releaseName: grafana
      valuesObject:
        admin:
          existingSecret: grafana-admin
        testFramework:
          enabled: false
        service:
          type: LoadBalancer
          port: 3000
        resources:
          requests:
            cpu: 20m
            memory: 128Mi
          limits:
            memory: 384Mi
        datasources:
          datasources.yaml:
            apiVersion: 1
            datasources:
              - name: Prometheus
                uid: prometheus
                type: prometheus
                url: http://prometheus-server.observabilidad.svc:9090
                access: proxy
                isDefault: true
        dashboardProviders:
          dashboardproviders.yaml:
            apiVersion: 1
            providers:
              - name: poc-almagentic
                folder: POC ALM agéntico
                type: file
                disableDeletion: true
                editable: false
                options:
                  path: /var/lib/grafana/dashboards/poc
        dashboardsConfigMaps:
          poc: grafana-paneles
  destination:
    server: https://kubernetes.default.svc
    namespace: observabilidad
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
