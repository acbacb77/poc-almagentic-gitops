# Prometheus y Alertmanager (tarea 11). Chart fijado por versión; sin disco persistente
# (clúster local) y solo con lo necesario: ni node-exporter, ni kube-state-metrics, ni pushgateway.
# Prometheus descubre los pods con anotaciones prometheus.io/* (API en :9000, exportador en :9100).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: prometheus
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: prometheus
    targetRevision: 29.37.1
    helm:
      releaseName: prometheus
      valuesObject:
        kube-state-metrics:
          enabled: false
        prometheus-node-exporter:
          enabled: false
        prometheus-pushgateway:
          enabled: false
        server:
          retention: 2d
          persistentVolume:
            enabled: false
          service:
            type: LoadBalancer
            servicePort: 9090
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              memory: 768Mi
        alertmanager:
          persistence:
            enabled: false
          config:
            global: {}
            receivers:
              - name: puente-github
                webhook_configs:
                  - url: http://puente-alertas.observabilidad.svc:8080/alertas
                    send_resolved: true
              # Alertas del proceso (tarea E): solo se ven en Grafana y Prometheus. No abren issues:
              # son fallos de la plataforma, no peticiones de producto.
              - name: solo-panel
            route:
              receiver: puente-github
              routes:
                - matchers: ['ambito="proceso"']
                  receiver: solo-panel
              group_by: [alertname]
              group_wait: 30s
              group_interval: 5m
              repeat_interval: 24h
        serverFiles:
          alerting_rules.yml:
            groups:
              - name: poc-almagentic-app
                rules:
                  - alert: BusquedasRechazadas
                    # Más del 20 % de las búsquedas de los últimos 5 minutos reciben 422 y al menos 10.
                    expr: |
                      (
                        sum(rate(app_consultas_total{ruta="/api/v1/productos",estado="422"}[5m]))
                          / sum(rate(app_consultas_total{ruta="/api/v1/productos"}[5m]))
                      ) > 0.2
                      and sum(increase(app_consultas_total{ruta="/api/v1/productos",estado="422"}[5m])) >= 10
                    for: 1m
                    labels:
                      severity: aviso
                    annotations:
                      summary: Muchas búsquedas de productos se rechazan por longitud
                      valor: '{{ $value | humanizePercentage }} de las búsquedas en 5 minutos'
                      description: >-
                        En staging, el {{ $value | humanizePercentage }} de las búsquedas de los últimos 5 minutos
                        (GET /api/v1/productos?q=…) ha recibido 422 porque el texto de q supera los 200 caracteres
                        (FR-009 de la spec 002-buscar-productos-nombre, ampliado por la spec 003). O hay clientes que necesitan un límite mayor
                        o hay un cliente mal configurado. Por privacidad no se registra el texto buscado (FR-011),
                        solo la longitud en el log de búsqueda.
                      para_quien: La tienda web que consume la API
                      impacto: Que la tienda pueda buscar con textos más largos, o confirmar que el límite actual es el correcto.
                      urgencia: Este mes
                  - alert: ApiSinRespuesta
                    expr: absent(up{app_kubernetes_io_name="poc-almagentic-app"} == 1)
                    for: 2m
                    labels:
                      severity: critica
                    annotations:
                      summary: La API del catálogo no responde en staging
                      valor: Ningún pod de la API responde a Prometheus
                      description: >-
                        Prometheus no consigue leer las métricas de ningún pod de poc-almagentic-app en staging
                        desde hace más de 2 minutos. Revisar el Deployment en Argo CD y los eventos del namespace.
                      urgencia: Está bloqueando a alguien
              - name: proceso-alm
                # Tarea E: alertas sobre el propio ciclo de vida, a partir de estado_alm.py.
                rules:
                  - alert: WorkflowEnRojoEnMain
                    expr: max by (repo, workflow) (alm_workflow_fallido_timestamp) > 0
                    for: 10m
                    labels:
                      severity: aviso
                      ambito: proceso
                    annotations:
                      summary: "El último run de {{ $labels.workflow }} en main de {{ $labels.repo }} ha fallado"
                  - alert: StagingPorDetras
                    expr: alm_staging_commits_detras > 0 and (time() - alm_staging_detras_desde_timestamp) > 86400
                    for: 10m
                    labels:
                      severity: aviso
                      ambito: proceso
                    annotations:
                      summary: "Staging lleva más de 24 h sin los últimos {{ $value }} commits de main"
                  - alert: EsperandoAUnaPersona
                    expr: max by (repo, numero, accion) (alm_pendiente_segundos) > 86400
                    for: 10m
                    labels:
                      severity: info
                      ambito: proceso
                    annotations:
                      summary: "{{ $labels.repo }}#{{ $labels.numero }} lleva más de 24 h esperando: {{ $labels.accion }}"
                  - alert: PromocionSustituida
                    expr: alm_promociones_sustituidas > 0
                    for: 30m
                    labels:
                      severity: info
                      ambito: proceso
                    annotations:
                      summary: "Hay {{ $value }} promociones abiertas a las que ya sustituye una más nueva"
                  - alert: TokenGitHubCaducaPronto
                    expr: (alm_token_caduca_timestamp - time()) < 7 * 86400
                    for: 10m
                    labels:
                      severity: aviso
                      ambito: proceso
                    annotations:
                      summary: El token de GitHub del puente y del colector caduca en menos de 7 días
                  - alert: ArgoCDDesincronizado
                    expr: alm_argocd_app{sync!="Synced"} or alm_argocd_app{health!="Healthy"}
                    for: 15m
                    labels:
                      severity: aviso
                      ambito: proceso
                    annotations:
                      summary: "La aplicación {{ $labels.app }} de Argo CD está {{ $labels.sync }} / {{ $labels.health }}"
                  - alert: ColectorSinDatos
                    expr: alm_colector_ok == 0 or absent(alm_colector_ok)
                    for: 15m
                    labels:
                      severity: aviso
                      ambito: proceso
                    annotations:
                      summary: El colector del estado del proceso no consigue leer GitHub o Argo CD
  destination:
    server: https://kubernetes.default.svc
    namespace: observabilidad
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
